[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pywall"
version = "0.13.0"
description = "Desktop tools for masonry-image segmentation and archaeological drawing support."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
  { name = "Andrea Fiorini", email = "andrea.fiorini6@unibo.it" },
]
keywords = [
  "archaeology of architecture",
  "digital archaeology",
  "image segmentation",
  "masonry",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Win32 (MS Windows)",
  "Intended Audience :: Science/Research",
  "Natural Language :: Italian",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
  "numpy>=1.24",
  "Pillow>=9.5",
  "opencv-python>=4.8",
  "scikit-learn>=1.3",
  "scikit-image>=0.21",
  "scipy>=1.10",
  "ttkbootstrap>=1.10",
  "ezdxf>=1.1",
]

[project.optional-dependencies]
sam2 = [
  "SAM-2 @ git+https://github.com/facebookresearch/sam2.git@2b90b9f5ceec907a1c18123530e92e794ad901a4",
]
dev = ["pytest>=8.0", "PyYAML>=6.0"]

[project.scripts]
pywall = "PyWALL_v13:main"

[project.urls]
Repository = "https://github.com/AndreaF-UniBO/PyWALL"
Documentation = "https://github.com/AndreaF-UniBO/PyWALL#installation"
Issues = "https://github.com/AndreaF-UniBO/PyWALL/issues"

[tool.setuptools]
py-modules = ["PyWALL_v13", "sam2_segmentation"]
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
