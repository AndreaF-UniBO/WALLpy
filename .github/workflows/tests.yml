name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package and test dependencies
        run: python -m pip install ".[dev]"

      - name: Compile Python sources
        run: python -m compileall -q WALLpy_v12.py sam2_segmentation.py

      - name: Smoke-test imports
        run: python -c "import WALLpy_v12, sam2_segmentation; print(WALLpy_v12.__version__)"

      - name: Run tests
        run: python -m pytest

