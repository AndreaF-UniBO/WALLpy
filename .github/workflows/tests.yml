name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package and test dependencies
        run: python -m pip install ".[dev]"

      - name: Compile Python sources
        run: python -m compileall -q PyWALL_v13.py sam2_segmentation.py

      - name: Smoke-test imports
        run: python -c "import PyWALL_v13, sam2_segmentation; print(PyWALL_v13.__version__)"

      - name: Run tests
        run: python -m pytest
